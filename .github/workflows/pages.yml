name: Publish GitHub Pages
on:
  push:
    branches: [main, codex/native-pages-runner-20261128]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  pages:
    runs-on: [self-hosted, macOS, X64, filip-v2-native-pages]
    environment:
      name: github-pages
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up GNU tar
        run: |
          set -eu
          test -x "$HOME/.local/share/github-pages-gnu-tar/bin/gtar"
          echo "$HOME/.local/share/github-pages-gnu-tar/bin" >> "$GITHUB_PATH"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
